<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de cabinet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131c2e" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Mise en page : une colonne sur téléphone avec barre d'onglets en bas ; sur ordinateur, navigation à gauche et tableau de bord sur deux colonnes. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#0f1f3a; --muted:#5b6b85; --line:#dbe3f0;
  --accent:#1d5fd6; --accent-ink:#ffffff; --accent-soft:#e3edfd; --bar:#9dbdf3;
  --warn:#8a5200; --warn-soft:#fcf0d6; --danger:#b3261e; --shade:rgba(15,31,58,.45);
  --paper:#ffffff; --paper-ink:#111111; --paper-line:#8a8a8a;
  --f-text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(15,31,58,.05),0 6px 18px rgba(15,31,58,.06); --glass:rgba(255,255,255,.86);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --ink:#e8eefa; --muted:#93a3be; --line:#26334d;
  --accent:#74aaff; --accent-ink:#06162f; --accent-soft:#182b4d; --bar:#2f5596;
  --warn:#f0c36a; --warn-soft:#3a2e12; --danger:#ff8a80; --shade:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); --glass:rgba(19,28,46,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --ink:#e8eefa; --muted:#93a3be; --line:#26334d;
  --accent:#74aaff; --accent-ink:#06162f; --accent-soft:#182b4d; --bar:#2f5596;
  --warn:#f0c36a; --warn-soft:#3a2e12; --danger:#ff8a80; --shade:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4); --glass:rgba(19,28,46,.86); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-text);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800}
h2{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* En-tête et navigation */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:baseline;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:800 17px var(--f-display);color:var(--accent)}
.cab{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncdot{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;min-height:56px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
main{display:flex;flex-direction:column;gap:16px;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13.5px;font-weight:500}
.banner .btn{min-height:36px;padding:6px 12px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:56px;font-size:17px;width:100%;font-family:var(--f-display);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}

/* Blocs */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:800 clamp(20px,6.2vw,30px)/1.15 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .val small{font-size:.55em;font-weight:700;color:var(--muted)}
.kpi.day{background:var(--accent-soft);border-color:transparent}
.datebar{display:flex;gap:8px;align-items:flex-end}
.datebar label{flex:1}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.list .item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .amt{font-size:16px}
button.item{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.rank .track{height:6px;border-radius:3px;background:var(--accent-soft);margin-top:5px}
.rank .fill{height:100%;border-radius:3px;background:var(--accent)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--line);color:var(--muted)}
.empty{padding:14px 0;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum .num{font-size:22px;font-weight:800}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:10px var(--f-text)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar)} .chart .bar.sel{fill:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .seltick{fill:var(--accent);font-weight:700}

/* Feuilles (éditeur, détail, confirmation) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.sheet-head h2{flex:1;text-align:center;font-size:17px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet-foot{background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-foot .tot{flex:1;display:flex;flex-direction:column;line-height:1.2}
.sheet-foot .tot .num{font-size:24px;font-weight:800}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.line .ctl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end}
.line .sub{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.line .sub .num{font-size:17px}
.step{display:flex;align-items:center}
.step button{width:44px;height:46px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600;cursor:pointer}
.step button:first-child{border-radius:10px 0 0 10px}.step button:last-child{border-radius:0 10px 10px 0}
.step input{width:52px;text-align:center;border-radius:0;border-left:0;border-right:0;padding:10px 2px}
.x{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--danger);font-size:20px;cursor:pointer}
.err{color:var(--danger);font-weight:600;font-size:14px}
.check{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.scrim{position:fixed;inset:0;z-index:70;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

#gate{z-index:65;background:var(--bg)!important;align-items:center;justify-content:center;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.gate-in .btn.big{width:100%}

/* Document imprimable (toujours noir sur blanc) */
#apercu{z-index:60}
#apercu .sheet-body{padding:12px}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:210mm;margin:0 auto;padding:clamp(14px,5vw,14mm);font:12.5px/1.45 var(--f-text);border:1px solid var(--line)}
.paper h1{font-size:19px;color:var(--paper-ink)}
.paper .p-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:14px}
.paper .p-cab{font-weight:700;font-size:15px;font-family:var(--f-display)}
.paper .p-meta{text-align:right}
.paper table{width:100%;border-collapse:collapse;margin-top:12px}
.paper th,.paper td{border-bottom:1px solid var(--paper-line);padding:6px 5px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.paper th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--paper-ink)}
.paper .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.paper tfoot td{border-bottom:0;border-top:1.5px solid var(--paper-ink);font-weight:700;font-size:14px}
.paper .p-note{margin-top:14px}
.paper .p-foot{margin-top:22px;font-size:11px;color:var(--paper-ink)}
.paper .p-sign{margin-top:36px;text-align:right}

@media (min-width:900px){
  .tabs{top:0;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:76px 12px 12px}
  .tabs a{flex:none;flex-direction:row;gap:12px;justify-content:flex-start;padding:12px 14px;border-radius:10px;font-size:15px;min-height:48px}
  .tabs a[aria-current="page"]{background:var(--accent-soft)}
  .top{z-index:11;position:fixed;left:0;width:210px;border-bottom:0;background:transparent}
  .top-in{flex-direction:column;gap:2px;padding:18px 26px}
  body{padding-left:210px}
  main{padding-block:28px 40px;padding-left:28px;padding-right:28px}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .cols>div{display:flex;flex-direction:column;gap:16px;min-width:0}
  .sheet:not(#apercu){background:var(--shade);align-items:center;justify-content:center}
  .sheet:not(#apercu)>.sheet-in{width:640px;max-height:90vh;border-radius:16px;overflow:hidden;background:var(--bg)}
  .toast{bottom:28px}
  .btn.big{width:auto;padding-inline:28px}
}
.sheet-in{display:flex;flex-direction:column;flex:1;min-height:0;width:100%}
@media (max-width:899px){.cols,.cols>div{display:flex;flex-direction:column;gap:16px}}

/* Confort tactile et finitions */
body{touch-action:manipulation;overscroll-behavior-y:none}
body:has(.sheet:not([hidden])){overflow:hidden}
.btn,.tabs a,.seg button,.step button,.x,button.item{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn:active:not(:disabled),.step button:active,.x:active{transform:scale(.97)}
button.item:active{background:var(--accent-soft)}
button.item{border-radius:10px;padding-left:6px;padding-right:6px;margin:0 -6px;width:calc(100% + 12px)}
.btn{border-radius:12px}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.big{border-radius:16px}
input,select,textarea{border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.panel,.kpi,.line{border-color:transparent;box-shadow:var(--shadow)}
.kpi.day{background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#0a2a6b));color:var(--accent-ink)}
.kpi.day .lab,.kpi.day .muted,.kpi.day .val small{color:inherit;opacity:.82}
.kpi.day strong{color:inherit!important}
.top,.tabs,body::before{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.tabs a svg{box-sizing:content-box;padding:3px 16px;border-radius:99px;transition:background-color .2s}
.tabs a[aria-current="page"] svg{background:var(--accent-soft)}
.seg{border-radius:12px;padding:3px;gap:3px;background:var(--line);border:0}
.seg button{border-radius:9px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.sheet-body{overscroll-behavior:contain}
.toast{border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (min-width:900px){.top{-webkit-backdrop-filter:none;backdrop-filter:none}.tabs a svg{padding:0;background:none!important}}
@media (prefers-reduced-motion:no-preference){
  .btn,.step button,.x{transition:transform .12s,background-color .15s,box-shadow .15s}
  @keyframes monte{from{transform:translateY(28px);opacity:0}}
  @keyframes fondu{from{opacity:0;transform:translateY(6px)}}
  .sheet:not([hidden])>.sheet-in{animation:monte .26s cubic-bezier(.2,.8,.2,1)}
  #apercu:not([hidden]),#gate:not([hidden])>.gate-in,.scrim:not([hidden])>.dialog{animation:fondu .22s ease-out}
  #view.entre>*{animation:fondu .24s ease-out both}
  @keyframes apparait{from{opacity:0}}
  .toast:not([hidden]){animation:apparait .2s ease-out}
  .rank .fill{transition:width .4s ease-out}
}

@page{size:A4;margin:14mm}
@media print{
  :root{padding:0}
  html,body{background:var(--paper)!important;padding:0!important}
  body::before,body>*:not(#apercu){display:none!important}
  #apercu{position:static;display:block;background:var(--paper)}
  #apercu .sheet-head,#apercu .noprint{display:none!important}
  #apercu .sheet-body{padding:0;overflow:visible;display:block}
  .paper{border:0;padding:0;max-width:none;font-size:11.5pt}
  .paper thead{display:table-header-group}
  .paper tr{break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background-color .12s}}
</style>

<header class="top"><div class="top-in"><span class="brand">Carnet de cabinet</span><span class="cab" id="cab-name"></span><span class="syncdot" id="sync-dot"></span></div></header>

<main>
  <div id="banners"></div>
  <div id="view"></div>
</main>

<nav class="tabs" aria-label="Navigation principale">
  <a href="#tableau" data-tab="tableau"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.5"/></svg>Tableau de bord</a>
  <a href="#factures" data-tab="factures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/></svg>Factures</a>
  <a href="#prestations" data-tab="prestations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5v-8a1 1 0 0 1 1-1h8l8 8-9 9z"/><circle cx="8" cy="8" r="1.4"/></svg>Prestations</a>
</nav>

<div class="sheet" id="editor" hidden><div class="sheet-in">
  <div class="sheet-head"><button class="btn ghost" data-act="closeEditor">Annuler</button><h2 id="ed-title">Nouvelle facture</h2><span style="width:80px"></span></div>
  <div class="sheet-body" id="ed-body"></div>
  <div class="sheet-foot"><div class="tot"><span class="small muted">Total général</span><span class="num" id="ed-total">0 DA</span></div><button class="btn primary" data-act="saveInvoice" id="ed-save">Enregistrer</button></div>
</div></div>

<div class="sheet" id="modal" hidden><div class="sheet-in">
  <div class="sheet-head"><button class="btn ghost" data-act="closeModal">Fermer</button><h2 id="modal-title"></h2><span style="width:80px"></span></div>
  <div class="sheet-body" id="modal-body"></div>
</div></div>

<div class="sheet" id="apercu" hidden>
  <div class="sheet-head"><button class="btn ghost" data-act="closeApercu">Fermer</button><h2 id="ap-title">Aperçu</h2><button class="btn primary" id="ap-print" data-act="printNow">Imprimer</button></div>
  <div class="sheet-body"><p class="small muted noprint" id="ap-note" style="margin:0;text-align:center"></p><div id="paper"></div></div>
</div>

<div class="sheet" id="gate" hidden><form class="gate-in" id="gate-form" novalidate>
  <div class="brand" style="font-size:28px">Carnet de cabinet</div>
  <p id="gate-msg" class="muted" style="margin:0"></p>
  <div class="banner" id="sy-info" hidden></div>
  <label id="gate-l-email">E-mail<input id="sy-email" type="email" autocapitalize="off" autocomplete="username"></label>
  <label id="gate-l-pass"><span id="gate-pass-lab">Mot de passe</span><input id="sy-pass" type="password" autocomplete="current-password"></label>
  <div class="err" id="sy-err" hidden></div>
  <button class="btn primary big" type="submit" id="gate-btn">Se connecter</button>
  <button class="btn ghost" type="button" id="gate-alt" data-act="gateAlt">Créer un compte</button>
  <button class="btn ghost" type="button" id="gate-forgot" data-act="gateForgot">Mot de passe oublié ?</button>
  <button class="btn danger" type="button" id="gate-wipe" data-act="wipeDevice" hidden>Effacer les données de cet appareil</button>
  <p class="small muted" style="margin:0">Après la première connexion, l’application s’ouvre aussi sans réseau sur cet appareil.</p>
</form></div>

<div class="scrim" id="confirm" hidden><div class="dialog" role="alertdialog" aria-modal="true"><div id="confirm-msg"></div><div class="row end"><button class="btn" data-act="confirmNo">Annuler</button><button class="btn primary" id="confirm-ok" data-act="confirmYes">Confirmer</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
var KEY='carnet-dentaire-v1';
var EMBED=false; try{EMBED=window.self!==window.top}catch(e){EMBED=true}
var $=function(s){return document.querySelector(s)};
var MODES={especes:'Espèces',carte:'Carte',cheque:'Chèque',virement:'Virement'};
var storageOK=true, demo=null, real=load();
function D(){return demo||real}

/* ---------- Données ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fresh(){
  var ex=[['Consultation',1500],['Détartrage',3500],['Obturation',4000],['Extraction simple',3000],['Traitement endodontique',8000],['Radiographie',1000]];
  return {version:1,cabinet:{nom:'',praticien:'',adresse:'',tel:'',mentions:''},
    services:ex.map(function(e,i){return {id:'s'+(i+1),nom:e[0],prix:e[1],actif:true,exemple:true}}),
    invoices:[],compteur:{},derniereSauvegarde:null};
}
function normalize(d){
  var f=fresh();
  if(!d||typeof d!=='object'||!Array.isArray(d.services)||!Array.isArray(d.invoices))return null;
  d.cabinet=Object.assign(f.cabinet,d.cabinet||{});
  d.compteur=d.compteur||{}; d.version=1;
  d.services.forEach(function(s){s.prix=Math.max(0,Math.round(+s.prix||0));s.actif=s.actif!==false;s.nom=String(s.nom||'');if(!s.maj&&s.exemple===false)s.maj='2000-01-01T00:00:00.000Z'});
  d.invoices=d.invoices.filter(function(i){return i&&i.id&&/^\d{4}-\d\d-\d\d$/.test(i.date)&&Array.isArray(i.lignes)});
  d.invoices.forEach(function(i){i.numero=String(i.numero||'');i.patient=i.patient||'';
    i.recu=i.recu==null?null:Math.max(0,Math.round(+i.recu||0));i.mode=MODES[i.mode]?i.mode:'especes';
    if(!i.maj)i.maj=i.modifieLe||i.creeLe||'2000-01-01T00:00:00.000Z';
    i.lignes.forEach(function(l){l.qte=Math.max(1,Math.round(+l.qte||1));l.prix=Math.max(0,Math.round(+l.prix||0));l.libelle=String(l.libelle||'')})});
  return d;
}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=normalize(JSON.parse(raw)); if(d)return d}}
  catch(e){storageOK=false}
  return fresh();
}
function save(){
  if(demo)return;
  try{localStorage.setItem(KEY,JSON.stringify(real));storageOK=true;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});}
  catch(e){storageOK=false}
}

/* ---------- Outils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function grp(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fmt(n){return grp(n)+' DA'}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function toDate(s){return new Date(s+'T12:00:00')}
function dfr(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dlong(s){return toDate(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function mlong(m){var s=toDate(m+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function invTotal(i){return i.lignes.reduce(function(a,l){return a+l.qte*l.prix},0)}
function sumInv(a){return a.reduce(function(t,i){return t+invTotal(i)},0)}
function recuDe(i){var t=invTotal(i);return i.recu==null?t:Math.min(i.recu,t)}
function resteDe(i){return invTotal(i)-recuDe(i)}
function sumRecu(a){return a.reduce(function(t,i){return t+recuDe(i)},0)}
function etatPill(i){var r=resteDe(i);return r<=0?'':' <span class="pill">'+(recuDe(i)===0?'Impayée':'Reste '+fmt(r))+'</span>'}
function pl(n,w){return n+' '+w+(n>1?'s':'')}
function lignesTxt(i){return i.lignes.map(function(l){return l.libelle+(l.qte>1?' ×'+l.qte:'')}).join(', ')}
function parseIntLoose(v){return parseInt(String(v).replace(/[^\d]/g,''),10)||0}
function byRegister(a,b){return a.date<b.date?-1:a.date>b.date?1:a.numero.localeCompare(b.numero,'fr',{numeric:true})}
function nextNumero(y){
  var max=D().compteur[y]||0;
  D().invoices.forEach(function(i){var m=/^F-(\d{4})-(\d+)$/.exec(i.numero);if(m&&+m[1]===y)max=Math.max(max,+m[2])});
  return 'F-'+y+'-'+String(max+1).padStart(4,'0');
}
function enLettres(n){
  if(n===0)return 'zéro';
  var U=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  var T=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  function s100(n){
    if(n<20)return U[n];
    var d=Math.floor(n/10),u=n%10;
    if(d===7||d===9)return T[d]+(d===7&&u===1?' et ':'-')+U[10+u];
    if(u===0)return d===8?'quatre-vingts':T[d];
    if(u===1&&d!==8)return T[d]+' et un';
    return T[d]+'-'+U[u];
  }
  function s1000(n,fin){
    var c=Math.floor(n/100),r=n%100,s='';
    if(c===1)s='cent';else if(c>1)s=U[c]+' cent'+(r===0&&fin?'s':'');
    if(r)s+=(s?' ':'')+s100(r);
    return fin?s:s.replace(/quatre-vingts$/,'quatre-vingt');
  }
  var out=[],M=Math.floor(n/1e6),K=Math.floor(n%1e6/1000),R=n%1000;
  if(M)out.push(s1000(M,true)+' million'+(M>1?'s':''));
  if(K)out.push(K===1?'mille':s1000(K,false)+' mille');
  if(R)out.push(s1000(R,true));
  return out.join(' ')+(M&&!K&&!R?' de':'');
}

/* ---------- État d'interface ---------- */
var ui={view:'tableau',day:today(),fMode:'jour',fDay:today(),fMonth:today().slice(0,7),fFrom:today().slice(0,8)+'01',fTo:today()};
var draft=null, edErr='', confirmCb=null, toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}
function ask(html,okLabel,cb){$('#confirm-msg').innerHTML=html;$('#confirm-ok').textContent=okLabel;confirmCb=cb;$('#confirm').hidden=false}

/* ---------- Rendu général ---------- */
function render(){
  var v=(location.hash||'').slice(1);
  ui.view=['tableau','factures','prestations'].indexOf(v)>=0?v:'tableau';
  document.querySelectorAll('.tabs a').forEach(function(a){if(a.dataset.tab===ui.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var gated=!EMBED&&(!sess||sy.login||gateMode==='newpass');
  $('#gate').hidden=!gated;
  if(gated){
    $('#view').innerHTML='';$('#banners').innerHTML='';$('#cab-name').textContent='';updSyncUI();
    ['#editor','#modal','#apercu'].forEach(function(x){$(x).hidden=true});
    renderGate();
    return;
  }
  $('#cab-name').textContent=D().cabinet.nom||'';
  var b='';
  if(!storageOK)b+='<div class="banner"><span>Le stockage de ce navigateur est indisponible (navigation privée ?). Vos saisies ne seront pas conservées.</span></div>';
  var seen={},dups={};D().invoices.forEach(function(i){var k=i.numero.trim().toLowerCase();if(seen[k])dups[i.numero]=1;seen[k]=1});
  if(Object.keys(dups).length)b+='<div class="banner"><span>Numéro en double (factures créées sur deux appareils sans connexion) : '+esc(Object.keys(dups).join(', '))+'. Ouvrez l’une des deux et changez son numéro.</span></div>';
  updSyncUI();
  if(EMBED)b+='<div class="banner"><span>Aperçu : l’impression et le fichier de sauvegarde ne fonctionnent que dans la version installée (fichier livré).</span></div>';
  $('#banners').innerHTML=b; $('#banners').hidden=!b;
  $('#banners').style.cssText='display:flex;flex-direction:column;gap:8px';
  ({tableau:viewDash,factures:viewFactures,prestations:viewPrestations})[ui.view]();
}

/* ---------- Tableau de bord ---------- */
function viewDash(){
  var d=ui.day,m=d.slice(0,7),all=D().invoices;
  var jour=all.filter(function(i){return i.date===d}),mois=all.filter(function(i){return i.date.slice(0,7)===m});
  var isToday=d===today();
  var h='<div class="head"><h1>Tableau de bord</h1></div>';
  h+='<button class="btn primary big" data-act="newInvoice">+ Nouvelle facture</button>';
  h+='<div class="datebar"><label>Date consultée<input type="date" id="dash-date" value="'+d+'"></label>'+(isToday?'':'<button class="btn" data-act="goToday">Aujourd’hui</button>')+'</div>';
  h+='<div class="kpis">'+kpi('day',isToday?'Aujourd’hui':dfr(d),jour)+kpi('',cap(mlong(m)),mois)+'</div>';
  if(!demo&&all.length){var ds=real.derniereSauvegarde,days=ds?Math.floor((Date.now()-new Date(ds))/864e5):null;
    if(days===null||days>=7)h+='<div class="banner"><span>'+(days===null?'Aucune sauvegarde exportée pour l’instant.':'Dernière sauvegarde il y a '+days+' jours.')+' Vos factures n’existent que sur cet appareil.</span><a class="btn" href="#prestations">Sauvegarder</a></div>'}
  h+='<div class="cols"><div>';
  h+='<section class="panel"><div class="head"><h2>Facturé par jour</h2><span class="small muted">'+cap(mlong(m))+'</span></div>'+(mois.length?chart(m,mois,d):'<div class="empty">Aucune facture ce mois-ci.</div>')+'</section>';
  h+='<section class="panel"><div class="head"><h2>Prestations du mois</h2><span class="small muted">classées par montant</span></div>'+ranking(mois)+'</section>';
  h+='</div><div>';
  var last=all.slice().sort(function(a,b){return b.date.localeCompare(a.date)||String(b.creeLe||'').localeCompare(String(a.creeLe||''))}).slice(0,5);
  var du=all.filter(function(i){return resteDe(i)>0}).sort(byRegister);
  if(du.length)h+='<section class="panel" id="dus"><div class="head"><h2>Restes à payer</h2><span class="num" style="color:var(--warn)">'+fmt(du.reduce(function(t,i){return t+resteDe(i)},0))+'</span></div><div class="list">'+du.slice(0,6).map(function(i){return '<div class="item"><div class="main"><span class="t">'+esc(i.numero)+' · '+dfr(i.date)+(i.patient?' · '+esc(i.patient):'')+'</span><span class="s">'+(recuDe(i)?'Reçu '+fmt(recuDe(i))+' sur '+fmt(invTotal(i)):'Impayée')+'</span></div><span class="num amt">'+fmt(resteDe(i))+'</span><button class="btn" data-act="openInvoice" data-id="'+i.id+'">Ouvrir</button></div>'}).join('')+'</div>'+(du.length>6?'<p class="small muted" style="margin:0">et '+pl(du.length-6,'autre facture')+' : voir le registre.</p>':'')+'</section>';
  h+='<section class="panel"><div class="head"><h2>Dernières factures</h2><a class="small" href="#factures" style="color:var(--accent);font-weight:600">Tout le registre</a></div>';
  if(last.length)h+='<div class="list">'+last.map(function(i){return '<div class="item"><div class="main"><span class="t">'+esc(i.numero)+' · '+dfr(i.date)+'</span><span class="s">'+esc(lignesTxt(i))+etatPill(i)+'</span></div><span class="num amt">'+fmt(invTotal(i))+'</span><button class="btn" data-act="openInvoice" data-id="'+i.id+'">Ouvrir</button></div>'}).join('')+'</div>';
  else h+='<div class="empty">Aucune facture enregistrée. Vos totaux démarrent à zéro.</div>';
  h+='</section></div></div>';
  $('#view').innerHTML=h;
}
function kpi(cls,lab,list){return '<div class="kpi '+cls+'"><span class="lab">'+esc(lab)+'</span><span class="val">'+grp(sumInv(list))+' <small>DA</small></span><span class="small muted">'+pl(list.length,'facture')+'</span><span class="small muted">Encaissé '+fmt(sumRecu(list))+(sumInv(list)-sumRecu(list)>0?' · <strong style="color:var(--warn)">reste '+fmt(sumInv(list)-sumRecu(list))+'</strong>':'')+'</span></div>'}
function niceMax(v){if(v<=0)return 1000;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(m,mois,sel){
  var y=+m.slice(0,4),mo=+m.slice(5,7),n=new Date(y,mo,0).getDate(),tot=[];
  for(var i=0;i<=n;i++)tot.push(0);
  mois.forEach(function(inv){tot[+inv.date.slice(8)]+=invTotal(inv)});
  var mx=niceMax(Math.max.apply(null,tot)),W=340,H=170,L=46,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B,step=pw/n,bw=Math.max(3,step*0.68);
  var s='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Montants facturés par jour, '+esc(mlong(m))+'">';
  [0,.5,1].forEach(function(f){var yy=T+ph-ph*f;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-5)+'" y="'+(yy+3.5)+'" text-anchor="end">'+grp(mx*f)+'</text>'});
  var selDay=+sel.slice(8);
  for(var d=1;d<=n;d++){
    var x=L+(d-1)*step,hh=tot[d]/mx*ph,day=m+'-'+pad(d);
    if(tot[d]>0)s+='<rect class="bar'+(d===selDay?' sel':'')+'" x="'+(x+(step-bw)/2).toFixed(1)+'" y="'+(T+ph-Math.max(hh,2)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(hh,2).toFixed(1)+'" rx="1.5"/>';
    if(d===selDay)s+='<text class="seltick" x="'+(x+step/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
    else if((d===1||d%5===0)&&Math.abs(d-selDay)>1)s+='<text x="'+(x+step/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
    s+='<rect class="hit" data-act="pickDay" data-id="'+day+'" x="'+x.toFixed(1)+'" y="'+T+'" width="'+step.toFixed(1)+'" height="'+(ph+B)+'"><title>'+dfr(day)+' : '+fmt(tot[d])+'</title></rect>';
  }
  return s+'</svg></div><p class="small muted" style="margin:0">Montants en DA. Touchez un jour pour l’afficher ; le jour consulté est en couleur pleine.</p>';
}
function ranking(mois){
  var map={};
  mois.forEach(function(i){i.lignes.forEach(function(l){var k=l.libelle;if(!map[k])map[k]={nom:k,n:0,t:0};map[k].n+=l.qte;map[k].t+=l.qte*l.prix})});
  var a=Object.keys(map).map(function(k){return map[k]}).sort(function(x,y){return y.t-x.t||y.n-x.n});
  if(!a.length)return '<div class="empty">Le classement apparaîtra avec vos premières factures du mois.</div>';
  var mx=a[0].t||1;
  return '<div class="list rank">'+a.map(function(r,i){return '<div class="item"><div class="main"><span class="t">'+(i+1)+'. '+esc(r.nom)+'</span><span class="s">'+pl(r.n,'acte')+'</span><div class="track"><div class="fill" style="width:'+Math.max(2,r.t/mx*100).toFixed(1)+'%"></div></div></div><span class="num amt">'+fmt(r.t)+'</span></div>'}).join('')+'</div>';
}

/* ---------- Registre ---------- */
function filtered(){
  var list,label,all=D().invoices;
  if(ui.fMode==='jour'){list=all.filter(function(i){return i.date===ui.fDay});label='Journée du '+dfr(ui.fDay)}
  else if(ui.fMode==='mois'){list=all.filter(function(i){return i.date.slice(0,7)===ui.fMonth});label=cap(mlong(ui.fMonth))}
  else{var a=ui.fFrom,b=ui.fTo;if(a>b){var t=a;a=b;b=t}list=all.filter(function(i){return i.date>=a&&i.date<=b});label='Du '+dfr(a)+' au '+dfr(b)}
  list=list.slice().sort(byRegister);
  return {list:list,label:label,total:sumInv(list),recu:sumRecu(list)};
}
function viewFactures(){
  var f=filtered(),h='<div class="head"><h1>Factures</h1></div>';
  h+='<div class="seg" role="group" aria-label="Type de période">'+[['jour','Journée'],['mois','Mois'],['plage','Période']].map(function(m){return '<button data-act="fMode" data-id="'+m[0]+'" aria-pressed="'+(ui.fMode===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>';
  if(ui.fMode==='jour')h+='<label>Journée<input type="date" id="f-day" value="'+ui.fDay+'"></label>';
  else if(ui.fMode==='mois')h+='<label>Mois<input type="month" id="f-month" value="'+ui.fMonth+'" placeholder="AAAA-MM"></label>';
  else h+='<div class="two"><label>Du<input type="date" id="f-from" value="'+ui.fFrom+'"></label><label>Au<input type="date" id="f-to" value="'+ui.fTo+'"></label></div>';
  h+='<section class="panel"><div class="sum"><div><div style="font-weight:600">'+esc(f.label)+'</div><div class="small muted">'+pl(f.list.length,'facture')+' · encaissé '+fmt(f.recu)+(f.total-f.recu>0?' · reste '+fmt(f.total-f.recu):'')+'</div></div><span class="num">'+fmt(f.total)+'</span></div>';
  h+='<button class="btn" data-act="printList"'+(f.list.length?'':' disabled')+'>'+(EMBED?'Aperçu de la liste imprimée':'Imprimer la liste')+'</button><button class="btn" data-act="exportCsv"'+(f.list.length&&!EMBED?'':' disabled')+'>Exporter pour Excel</button></section>';
  h+='<section class="panel">';
  if(f.list.length)h+='<div class="list">'+f.list.map(function(i){return '<button class="item" data-act="openInvoice" data-id="'+i.id+'"><div class="main"><span class="t">'+esc(i.numero)+' · '+dfr(i.date)+(i.patient?' · '+esc(i.patient):'')+'</span><span class="s">'+esc(lignesTxt(i))+etatPill(i)+'</span></div><span class="num amt">'+fmt(invTotal(i))+'</span></button>'}).join('')+'</div>';
  else h+='<div class="empty">Aucune facture sur cette période.</div>';
  h+='</section>';
  $('#view').innerHTML=h;
}

/* ---------- Prestations, cabinet, sauvegarde ---------- */
function viewPrestations(){
  var S=D().services,c=D().cabinet,h='<div class="head"><h1>Prestations</h1><button class="btn primary" data-act="editService">+ Ajouter</button></div>';
  if(S.some(function(s){return s.exemple}))h+='<div class="banner"><span>Les prix marqués « exemple » sont fournis à titre indicatif. Remplacez-les par vos tarifs.</span></div>';
  h+='<section class="panel"><div class="list">'+S.map(function(s){return '<button class="item" data-act="editService" data-id="'+s.id+'"><div class="main"><span class="t">'+esc(s.nom)+'</span><span class="s">'+(s.actif?'':'<span class="pill off">Désactivée</span> ')+(s.exemple?'<span class="pill">Prix exemple</span>':(s.actif?'Tarif par défaut':''))+'</span></div><span class="num amt">'+fmt(s.prix)+'</span></button>'}).join('')+'</div>';
  h+='<p class="small muted" style="margin:0">Un changement de tarif s’applique aux prochaines saisies. Les factures déjà enregistrées gardent leur libellé et leur prix.</p></section>';
  h+='<section class="panel"><h2>Cabinet (en-tête des impressions)</h2>'+
    '<label>Nom du cabinet<input id="cab-nom" data-cab="nom" value="'+esc(c.nom)+'" placeholder="Cabinet du Dr …"></label>'+
    '<label>Praticien<input id="cab-praticien" data-cab="praticien" value="'+esc(c.praticien)+'" placeholder="Dr …"></label>'+
    '<label>Adresse<input id="cab-adresse" data-cab="adresse" value="'+esc(c.adresse)+'"></label>'+
    '<label>Téléphone<input id="cab-tel" data-cab="tel" type="tel" value="'+esc(c.tel)+'"></label>'+
    '<label>Mentions (NIF, NIS, n° d’ordre…)<textarea id="cab-mentions" data-cab="mentions">'+esc(c.mentions)+'</textarea></label></section>';

function deliver(name,text,mime,done){
  function viaLink(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);done()}
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform||''));
  if(ios&&navigator.canShare){
    try{var file=new File([text],name,{type:mime});
      if(navigator.canShare({files:[file]})){navigator.share({files:[file]}).then(done).catch(function(e){if(!e||e.name!=='AbortError')viaLink()});return}
    }catch(e){}
  }

}

  var rows=[['Numéro','Date','Patient','Prestations','Total (DA)','Encaissé (DA)','Reste (DA)','Mode de paiement']].concat(f.list.map(function(i){return [i.numero,dfr(i.date),i.patient,lignesTxt(i),invTotal(i),recuDe(i),resteDe(i),recuDe(i)?MODES[i.mode||'especes']:'']}));

  var name='factures-'+f.label.toLowerCase().replace(/[^a-z0-9àâéèêîôûç]+/g,'-').replace(/^-|-$/g,'')+'.csv';
  deliver(name,'\ufeff'+rows.map(function(r){return r.map(function(v){return typeof v==='number'?v:c(v)}).join(';')}).join('\r\n'),'text/csv',function(){toast('Fichier exporté : '+name)});

      old.invoices.forEach(function(i){if(!keep['invoice:'+i.id])syn.tombs['invoice:'+i.id]=now});old.services.forEach(function(x){if(!keep['service:'+x.id])syn.tombs['service:'+x.id]=now});

      if(loc)row={data:loc,deleted:false},snap[key]=loc.maj||'';
      else if(syn.tombs[key])row={data:{maj:syn.tombs[key]},deleted:true},snap[key]=syn.tombs[key];
      else{delete syn.dirty[key];return}}
    row.user_id=sess.user_id;row.kind=kind;row.id=id;rows.push(row);
  });
  function chunk(i){
    if(i>=rows.length)return Promise.resolve();
    var part=rows.slice(i,i+300);
    return api('/rest/v1/carnet_items?on_conflict=user_id,kind,id',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:part}).then(function(){
      part.forEach(function(r){var key=r.kind+':'+r.id,cur=r.kind==='meta'?(real.cabinet.maj||''):(localOf(r.kind,r.id)||{}).maj||syn.tombs[key]||'';if(cur===snap[key])delete syn.dirty[key]});
      writeJ(YKEY,syn);return chunk(i+300)});
  }
  return chunk(0);
}
function sync(){
  if(!sess||demo||EMBED||sy.login)return Promise.resolve();
  if(sy.busy){sy.again=true;return Promise.resolve()}
  sy.busy=true;updSyncUI();
  return ensureToken().then(pull).then(function(changed){return push().then(function(){return changed})}).then(function(changed){
    sy.err='';sy.last=new Date();
    var a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#view').contains(a);
    if(changed&&!demo&&!typing)render();
    maybeOnboard();
  },function(e){sy.err=sy.login?'':(navigator.onLine===false?'hors connexion':(e&&e.message)||'erreur réseau');if(sy.login)render()})
  .then(function(){sy.busy=false;updSyncUI();if(sy.again){sy.again=false;queueSync()}});
}
function syncPanel(){
  if(demo)return '';

  if(EMBED)return h+'<p class="muted" style="margin:0">Indisponible dans cet aperçu. Elle fonctionne dans la version installée.</p></section>';
  if(sess&&!sy.login){
    return h+'<p style="margin:0">Connecté : <strong>'+esc(sess.email||'')+'</strong>. Vos factures et tarifs sont copiés sur votre compte Supabase et retrouvés sur chaque appareil connecté au même compte.</p>'+
      '<p class="small muted" id="sync-status" style="margin:0">'+esc(syncDetail())+'</p>'+
      '<div class="row"><button class="btn primary grow" data-act="syncNow">Synchroniser maintenant</button><button class="btn grow" data-act="signOut">Se déconnecter</button></div></section>';
  }
  return '';
}
var gateMode='in', recovery=null;
var GATE={'in':{msg:'Connectez-vous pour ouvrir votre carnet. Vos factures sont les mêmes sur tous vos appareils.',btn:'Se connecter',alt:'Créer un compte',pass:'Mot de passe'},
  up:{msg:'Créez votre compte. Chaque praticien a son propre carnet, que lui seul peut consulter.',btn:'Créer mon compte',alt:'J’ai déjà un compte',pass:'Mot de passe (8 caractères minimum)'},
  forgot:{msg:'Indiquez votre e-mail : vous recevrez un lien pour choisir un nouveau mot de passe.',btn:'Envoyer le lien',alt:'Retour à la connexion',pass:''},
  newpass:{msg:'Choisissez votre nouveau mot de passe.',btn:'Enregistrer le mot de passe',alt:'Annuler',pass:'Nouveau mot de passe (8 caractères minimum)'}};
function renderGate(){
  var g=GATE[gateMode];
  $('#gate-msg').textContent=sy.login&&gateMode==='in'?'Votre session a expiré. Reconnectez-vous ; rien n’est perdu sur cet appareil.':g.msg;
  if(!$('#gate-btn').disabled)$('#gate-btn').textContent=g.btn;
  $('#gate-alt').textContent=g.alt;$('#gate-pass-lab').textContent=g.pass;
  $('#gate-l-email').hidden=gateMode==='newpass';$('#gate-l-pass').hidden=gateMode==='forgot';$('#gate-forgot').hidden=gateMode!=='in';
  $('#sy-pass').setAttribute('autocomplete',gateMode==='in'?'current-password':'new-password');
  if(sess&&sess.email&&!$('#sy-email').value)$('#sy-email').value=sess.email;
}
function gateSet(mode){gateMode=mode;$('#sy-err').hidden=true;$('#sy-info').hidden=true;$('#gate-wipe').hidden=true;$('#sy-pass').value='';render()}
function gateBusy(on){var b=$('#gate-btn');b.disabled=on;b.textContent=on?'Un instant…':GATE[gateMode].btn}
function gateFail(m,wipe){var e=$('#sy-err');e.textContent=m;e.hidden=false;$('#gate-wipe').hidden=!wipe;gateBusy(false)}
function gateInfo(m){var e=$('#sy-info');e.textContent=m;e.hidden=false}
function authMsg(e){
  var m=(e&&e.message)||'';
  if(!e||!e.status)return 'Pas de réponse du serveur. Vérifiez la connexion Internet.';
  if(/already registered|already been registered/i.test(m))return 'Un compte existe déjà avec cet e-mail. Connectez-vous.';
  if(/signups? (not allowed|disabled)/i.test(m))return 'La création de compte est désactivée sur ce service.';
  if(/not confirmed/i.test(m))return 'E-mail non confirmé : ouvrez le lien reçu par e-mail, puis connectez-vous.';
  if(e.status===429||/rate limit/i.test(m))return 'Trop de tentatives. Réessayez dans quelques minutes.';
  if(/invalid login/i.test(m)||(gateMode==='in'&&e.status===400))return 'E-mail ou mot de passe incorrect.';
  if(/password/i.test(m)&&e.status===422)return 'Mot de passe refusé : choisissez-en un plus long ou moins courant.';
  return 'Erreur : '+m;
}
function adopt(j){
  var who=j.user&&j.user.id,base={url:SUPA_URL,key:SUPA_KEY};
  if(!j.access_token||!who)return gateFail('Réponse inattendue du serveur.');
  if(real.owner&&real.owner!==who){gateMode='in';gateBusy(false);renderGate();return gateFail('Cet appareil contient les données d’un autre compte. Connectez-vous avec ce compte, ou effacez les données de cet appareil.',true)}
  real.owner=who;save();
  sy.login=false;sy.err='';sy.last=null;setSession(j,base);
  syn.cursor=null;syn.dirty={};markAll();writeJ(YKEY,syn);
  gateMode='in';recovery=null;$('#sy-pass').value='';$('#sy-err').hidden=true;$('#sy-info').hidden=true;$('#gate-wipe').hidden=true;gateBusy(false);
  render();sync();
}
function gateSubmit(){
  var email=$('#sy-email').value.trim(),pass=$('#sy-pass').value,base={url:SUPA_URL,key:SUPA_KEY},back='?redirect_to='+encodeURIComponent(location.origin+location.pathname);
  $('#sy-err').hidden=true;$('#sy-info').hidden=true;
  if(gateMode!=='newpass'&&!/^\S+@\S+\.\S+$/.test(email))return gateFail('Indiquez une adresse e-mail valide.');
  if(gateMode==='in'&&!pass)return gateFail('Indiquez le mot de passe.');
  if((gateMode==='up'||gateMode==='newpass')&&pass.length<8)return gateFail('Le mot de passe doit contenir au moins 8 caractères.');
  gateBusy(true);
  var fail=function(e){gateFail(authMsg(e))};
  if(gateMode==='in')api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,cfg:base,body:{email:email,password:pass}}).then(adopt,fail);
  else if(gateMode==='up')api('/auth/v1/signup'+back,{method:'POST',auth:false,cfg:base,body:{email:email,password:pass}}).then(function(j){
    if(j&&j.access_token)return adopt(j);
    gateMode='in';gateBusy(false);$('#sy-pass').value='';renderGate();gateInfo('Compte créé. Ouvrez le lien de confirmation envoyé à '+email+', puis connectez-vous.');
  },fail);
  else if(gateMode==='forgot')api('/auth/v1/recover'+back,{method:'POST',auth:false,cfg:base,body:{email:email}}).then(function(){
    gateMode='in';gateBusy(false);renderGate();gateInfo('Si un compte existe pour '+email+', un lien de réinitialisation vient d’être envoyé.');
  },fail);
  else api('/auth/v1/user',{method:'PUT',cfg:base,token:recovery.access_token,body:{password:pass}}).then(function(){adopt(recovery)},fail);
}
function authHash(){
  var h=location.hash.slice(1);if(!/access_token=|error=/.test(h))return;
  var q=new URLSearchParams(h);
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(q.get('error')){setTimeout(function(){gateFail('Ce lien est invalide ou a expiré. Demandez-en un nouveau.')},0);return}
  var at=q.get('access_token'),pay;
  try{pay=JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return}
  var j={access_token:at,refresh_token:q.get('refresh_token'),expires_in:+q.get('expires_in')||3600,user:{id:pay.sub,email:pay.email}};
  if(q.get('type')==='recovery'){recovery=j;gateMode='newpass'}
  else setTimeout(function(){adopt(j)},0);
}

var PRESETS={
  dentaire:['Chirurgien-dentiste',[['Consultation',1500],['Détartrage',3500],['Obturation',4000],['Extraction simple',3000],['Traitement endodontique',8000],['Radiographie',1000]]],
  generaliste:['Médecin généraliste',[['Consultation',1500],['Consultation à domicile',3000],['Électrocardiogramme',1500],['Injection ou pansement',500],['Suture',2000],['Certificat médical',500]]],
  specialiste:['Médecin spécialiste',[['Consultation spécialisée',2500],['Consultation de contrôle',1500],['Échographie',3000],['Électrocardiogramme',1500],['Acte technique',5000],['Certificat médical',500]]],
  vide:['Autre activité (catalogue vide)',[]]};
var obShown=false;
function maybeOnboard(){
  if(obShown||demo||EMBED||!sess||real.cabinet.profil||real.invoices.length||!real.services.every(function(s){return s.exemple}))return;
  obShown=true;
  $('#modal-title').textContent='Bienvenue';
  $('#modal-body').innerHTML='<p style="margin:0">Trois informations pour préparer votre carnet. Tout reste modifiable ensuite dans « Prestations ».</p>'+
    '<label>Votre activité<select id="ob-profil">'+Object.keys(PRESETS).map(function(k){return '<option value="'+k+'">'+PRESETS[k][0]+'</option>'}).join('')+'</select></label>'+
    '<label>Nom du cabinet<input id="ob-nom" autocomplete="off" placeholder="Cabinet du Dr …"></label>'+
    '<label>Praticien<input id="ob-praticien" autocomplete="off" placeholder="Dr …"></label>'+
    '<p class="small muted" style="margin:0">Le catalogue de départ contient des prestations courantes avec des prix d’exemple. Il vous appartient : vous pouvez tout renommer, ajouter ou désactiver.</p>'+
    '<button class="btn primary big" data-act="saveOnboard">Commencer</button>';
  $('#modal').hidden=false;
}
function saveOnboard(){
  var k=$('#ob-profil').value,now=new Date().toISOString();if(!PRESETS[k])return;
  real.services.forEach(function(s){syn.tombs['service:'+s.id]=now;syn.dirty['service:'+s.id]=1});
  real.services=PRESETS[k][1].map(function(e,i){return {id:k+'-'+(i+1),nom:e[0],prix:e[1],actif:true,exemple:true,maj:now}});
  real.cabinet.profil=k;real.cabinet.nom=$('#ob-nom').value.trim();real.cabinet.praticien=$('#ob-praticien').value.trim();real.cabinet.maj=now;
  save();real.services.forEach(function(s){syn.dirty['service:'+s.id]=1});mark('meta','cabinet');
  $('#modal').hidden=true;render();toast('Votre carnet est prêt');
}
function wipeLocal(){
  demo=null;real=fresh();sess=null;syn={cursor:null,dirty:{},tombs:{}};
  writeJ(SKEY,null);writeJ(YKEY,null);save();sy.login=false;sy.err='';sy.last=null;
}
function signOut(){
  var n=pending();
  ask('<strong>Se déconnecter ?</strong><p style="margin:8px 0 0">Les factures seront retirées de cet appareil ; elles restent sur votre compte et reviendront à la prochaine connexion.'+(n?' <strong>Attention : '+pl(n,'modification')+' pas encore envoyée'+(n>1?'s':'')+' sera perdue. Synchronisez d’abord.</strong>':'')+'</p>','Se déconnecter',function(){wipeLocal();location.hash='#tableau';render()});
}
function wipeDevice(){
  ask('<strong>Effacer les données de cet appareil ?</strong><p style="margin:8px 0 0">Les factures présentes sur cet appareil et non synchronisées seront définitivement perdues.</p>','Effacer',function(){wipeLocal();$('#sy-err').hidden=true;$('#gate-wipe').hidden=true;render()});
}

/* ---------- Actions ---------- */
var ACT={
  newInvoice:function(){openEditor(null)},
  editInvoice:function(id){openEditor(id)},
  openInvoice:function(id){invoiceDetail(id)},
  closeEditor:function(){$('#editor').hidden=true;draft=null},
  closeModal:function(){$('#modal').hidden=true},
  closeApercu:function(){$('#apercu').hidden=true;$('#paper').innerHTML=''},
  printNow:function(){try{window.print()}catch(e){}},
  saveInvoice:saveInvoice,
  addLine:function(){draft.lignes.push(blank());renderEditor();var s=$('#ln-svc-'+(draft.lignes.length-1));if(s)s.scrollIntoView({block:'center'})},
  rmLine:function(i){if(draft.lignes.length>1){draft.lignes.splice(+i,1);renderEditor()}},
  qty:function(i,el){var l=draft.lignes[+i];l.qte=Math.max(1,l.qte+(+el.dataset.d));$('#ln-qte-'+i).value=l.qte;updTotals()},
  goToday:function(){ui.day=today();render()},
  pickDay:function(d){ui.day=d;render()},
  fMode:function(m){ui.fMode=m;render()},
  printInvoice:function(id){var i=D().invoices.find(function(x){return x.id===id});if(i){$('#modal').hidden=true;showDoc('Facture '+i.numero,invoiceDoc(i))}},
  printList:function(){var f=filtered();if(f.list.length)showDoc('Registre',registerDoc(f))},
  deleteInvoice:function(id){var i=D().invoices.find(function(x){return x.id===id});if(!i)return;
    ask('<strong>Supprimer la facture '+esc(i.numero)+' ?</strong><p style="margin:8px 0 0">'+fmt(invTotal(i))+' du '+dfr(i.date)+'. Cette action est définitive et son numéro ne sera pas réattribué.</p>','Supprimer',function(){D().invoices=D().invoices.filter(function(x){return x.id!==id});save();if(!demo){syn.tombs['invoice:'+id]=new Date().toISOString();mark('invoice',id)}$('#modal').hidden=true;render();toast('Facture '+i.numero+' supprimée')})},
  editService:function(id){serviceForm(id)},
  saveService:function(id){
    var nom=$('#svc-nom').value.trim(),raw=$('#svc-prix').value.trim(),prix=parseIntLoose(raw),e=$('#svc-err');
    if(!nom||raw===''||!/\d/.test(raw)){e.textContent=!nom?'Indiquez le nom de la prestation.':'Indiquez un prix en dinars.';e.hidden=false;return}
    var s=id?D().services.find(function(x){return x.id===id}):null;
    if(s){if(s.nom!==nom||s.prix!==prix)s.exemple=false;s.nom=nom;s.prix=prix;s.actif=$('#svc-actif').checked}
    else{s={id:uid(),nom:nom,prix:prix,actif:$('#svc-actif').checked,exemple:false};D().services.push(s)}
    s.maj=new Date().toISOString();save();mark('service',s.id);$('#modal').hidden=true;render();toast('Prestation enregistrée : '+nom+' · '+fmt(prix));
  },
  signOut:signOut, wipeDevice:wipeDevice, saveOnboard:saveOnboard, exportCsv:exportCsv,
  gateAlt:function(){if(gateMode==='newpass')recovery=null;gateSet(gateMode==='in'?'up':'in')},
  gateForgot:function(){gateSet('forgot')},
  markPaid:function(id){var i=D().invoices.find(function(x){return x.id===id});if(!i)return;i.recu=null;i.maj=i.modifieLe=new Date().toISOString();save();mark('invoice',id);$('#modal').hidden=true;render();toast('Facture '+i.numero+' marquée payée')}, syncNow:function(){sy.err='';sync()},
  exportData:exportData,
  pickRestore:function(){$('#restore-file').click()},
  confirmNo:function(){$('#confirm').hidden=true;confirmCb=null},
  confirmYes:function(){$('#confirm').hidden=true;var cb=confirmCb;confirmCb=null;if(cb)cb()}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var f=ACT[t.dataset.act];if(f)f(t.dataset.id,t)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dash-date'&&t.value){ui.day=t.value;render()}
  else if(t.id==='f-day'&&t.value){ui.fDay=t.value;render()}
  else if(t.id==='f-month'&&/^\d{4}-\d\d$/.test(t.value)){ui.fMonth=t.value;render()}
  else if(t.id==='f-from'&&t.value){ui.fFrom=t.value;render()}
  else if(t.id==='f-to'&&t.value){ui.fTo=t.value;render()}
  else if(t.dataset.cab){D().cabinet[t.dataset.cab]=t.value.trim();D().cabinet.maj=new Date().toISOString();save();mark('meta','cabinet');$('#cab-name').textContent=D().cabinet.nom;toast('Informations du cabinet enregistrées')}
  else if(t.id==='restore-file'){if(t.files&&t.files[0])restoreFrom(t.files[0]);t.value=''}
  else if(t.dataset.f==='svc'&&draft){
    var l=draft.lignes[+t.dataset.i],s=D().services.find(function(x){return x.id===t.value});

  }
  else if(t.id==='ed-statut'&&draft){draft.statut=t.value;if(t.value==='partiel'&&draft.recu==null)draft.recu=0;renderEditor()}
  else if(t.id==='ed-mode'&&draft)draft.mode=t.value;
  else if(t.dataset.f==='qte'&&draft){var q=Math.max(1,parseIntLoose(t.value));draft.lignes[+t.dataset.i].qte=q;t.value=q;updTotals()}

document.addEventListener('input',function(e){
  var t=e.target; if(!draft)return;
